services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: uploads
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

databases:
  # Free Postgres expires 30 days after creation. Upgrade this database in the
  # dashboard if discussions should be kept longer than that.
  - name: task-manager-db
    plan: free
    databaseName: taskmanager
    user: taskmanager
